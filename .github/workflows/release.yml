name: Build & Release

on:
  push:
    branches: [main, Pruebas(QA), Desarrollo, Produccion]
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Cliente-Rust/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Cliente-Rust/frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        working-directory: Cliente-Rust/backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          echo "VERSION=$($config.version)" >> $env:GITHUB_OUTPUT
        working-directory: Cliente-Rust/backend

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Cliente-Rust/backend/target/release/bundle/nsis/*.exe
            Cliente-Rust/backend/target/release/bundle/nsis/*.sig
            Cliente-Rust/backend/target/release/bundle/nsis/latest.json
