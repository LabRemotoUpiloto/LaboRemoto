name: Build & Release

on:
  # Solo Produccion publica releases publicos -- pushes a Desarrollo/
  # Pruebas(QA)/main tambien disparaban esto antes, generando un release
  # publico real (visible al auto-updater) por cada merge intermedio, no
  # solo cuando el codigo de verdad llega a produccion.
  push:
    branches: [Produccion]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Calcula UNA sola vez la version final y se la pasa a los jobs de build
  # por plataforma -- si cada job la calculara por su cuenta (como antes,
  # cuando solo existia el job de Windows) correrian en paralelo y podrian
  # terminar publicando en tags distintos si uno ve el listado de releases
  # publicados antes que el otro.
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      # La version viaja CODIFICADA (digitos -> letras, punto -> guion bajo). Si fuera en claro y contuviera
      # el valor de un secreto (p. ej. un puerto "22" en 3.5.22), GitHub la enmascara y DESCARTA la salida
      # del job: los jobs de build recibian VERSION vacia y tauri.conf.json fallaba con "version must be a
      # semver string". Cada job la decodifica en su paso "Decodificar la version".
      version_cod: ${{ steps.compute.outputs.version_cod }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que estén las claves que se embeben en la app
        # Sin estos secretos la versión sale sin modelo de IA ni prácticas de Linux (la app instalada no
        # tiene .env). Es mejor que el release falle aquí, con un mensaje claro, a publicar algo roto.
        shell: bash
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PRACTICE_LINUX_TUNNEL_HOST: ${{ secrets.PRACTICE_LINUX_TUNNEL_HOST }}
          PRACTICE_LINUX_TUNNEL_PORT: ${{ secrets.PRACTICE_LINUX_TUNNEL_PORT }}
          PRACTICE_LINUX_TUNNEL_USER: ${{ secrets.PRACTICE_LINUX_TUNNEL_USER }}
          PRACTICE_LINUX_TUNNEL_PASSWORD: ${{ secrets.PRACTICE_LINUX_TUNNEL_PASSWORD }}
          PRACTICE_LINUX_API_REMOTE_PORT: ${{ secrets.PRACTICE_LINUX_API_REMOTE_PORT }}
          PRACTICE_LINUX_API_TOKEN: ${{ secrets.PRACTICE_LINUX_API_TOKEN }}
          PRACTICE_LINUX_SSH_HOST: ${{ secrets.PRACTICE_LINUX_SSH_HOST }}
          PRACTICE_LINUX_SSH_PORT: ${{ secrets.PRACTICE_LINUX_SSH_PORT }}
          PRACTICE_LINUX_LOCAL_HOST: ${{ secrets.PRACTICE_LINUX_LOCAL_HOST }}
          PRACTICE_LINUX_LOCAL_PORT: ${{ secrets.PRACTICE_LINUX_LOCAL_PORT }}
        run: |
          faltan=""
          for v in GROQ_API_KEY PRACTICE_LINUX_TUNNEL_HOST PRACTICE_LINUX_TUNNEL_USER PRACTICE_LINUX_TUNNEL_PASSWORD PRACTICE_LINUX_API_TOKEN; do
            if [ -z "${!v}" ]; then faltan="$faltan $v"; fi
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secretos de GitHub Actions (Settings > Secrets and variables > Actions):$faltan"
            exit 1
          fi
          echo "Claves de compilación presentes (valores ocultos)."

      - name: Compute unique release version
        # La version comiteada en el repo (tauri.conf.json/Cargo.toml/package.json)
        # a veces se queda atras porque alguien se olvida de subirla antes de
        # mergear a Produccion -- eso hacia que el workflow reescribiera el
        # release ya publicado en vez de crear uno nuevo, y el auto-updater de
        # Tauri nunca veia una version mas alta para ofrecer (paso
        # silenciosamente esto con v3.5.2 -> v3.5.3). Este paso compara contra
        # el release mas alto ya publicado y, si hace falta, sube el patch
        # automaticamente -- el valor calculado se aplica luego en cada job de
        # build (workspace efimero del runner, nunca se comitea de vuelta,
        # evita pelear con la proteccion de rama que exige revisor).
        id: compute
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./Cliente-Rust/backend/tauri.conf.json').version")

          PUBLISHED=$(gh release list --repo LabRemotoUpiloto/LaboRemoto --limit 100 --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          HIGHEST=$(printf '%s\n' "$PUBLISHED" | sort -V | tail -1)

          if [ -z "$HIGHEST" ]; then
            FINAL_VERSION="$BASE_VERSION"
          else
            TOP=$(printf '%s\n%s\n' "$BASE_VERSION" "$HIGHEST" | sort -V | tail -1)
            if [ "$TOP" = "$BASE_VERSION" ] && [ "$BASE_VERSION" != "$HIGHEST" ]; then
              # La version del repo ya esta por delante de todo lo publicado.
              FINAL_VERSION="$BASE_VERSION"
            else
              IFS='.' read -r MAJ MIN PATCH <<< "$HIGHEST"
              FINAL_VERSION="$MAJ.$MIN.$((PATCH + 1))"
            fi
          fi

          echo "Version en el repo: $BASE_VERSION | Release mas alto publicado: ${HIGHEST:-ninguno} | Version final: $FINAL_VERSION"
          echo "version_cod=$(printf '%s' "$FINAL_VERSION" | tr '0123456789.' 'abcdefghij_')" >> "$GITHUB_OUTPUT"

  release-windows:
    needs: compute-version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Decodificar la version
        # Deja VERSION en el entorno de TODOS los pasos siguientes de este job (env.VERSION en expresiones).
        shell: bash
        env:
          VERSION_COD: ${{ needs.compute-version.outputs.version_cod }}
        run: |
          VERSION=$(printf '%s' "$VERSION_COD" | tr 'abcdefghij_' '0123456789.')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La version calculada no es valida (llego vacia o con otro formato)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Apply computed version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const f of ['Cliente-Rust/backend/tauri.conf.json', 'Cliente-Rust/frontend/package.json', 'Cliente-Rust/package.json']) {
              const content = fs.readFileSync(f, 'utf8');
              fs.writeFileSync(f, content.replace(/\"version\": \"[^\"]+\"/, '\"version\": \"' + version + '\"'));
            }
            const cargoPath = 'Cliente-Rust/backend/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + version + '\"'));
            console.log('Version aplicada:', version);
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Cliente-Rust/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Cliente-Rust/frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        # Binario ya compilado desde npm, con la version fija. Antes se hacia `cargo install tauri-cli`, que compila el CLI
        # y resuelve sus dependencias de Rust al momento: el 2026-10-16 fallo en los 4 jobs porque tauri-cli 2.12.x exige
        # `zip ^8` y todas esas versiones de zip fueron retiradas (yanked) de crates.io. Con esto el release no depende de
        # lo que pase en crates.io ese dia, y se ahorra la compilacion del CLI. 2.12.1 es la que uso el ultimo release bueno.
        run: npm install -g @tauri-apps/cli@2.12.1

      - name: Build Tauri app
        working-directory: Cliente-Rust/backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Claves que build.rs EMBEBE en el binario (la app instalada no trae .env). Ver build.rs.
          # KEYCLOAK_BASE_URL es opcional: si el secreto no existe, la app usa el dominio por defecto.
          KEYCLOAK_BASE_URL: ${{ secrets.KEYCLOAK_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PRACTICE_LINUX_TUNNEL_HOST: ${{ secrets.PRACTICE_LINUX_TUNNEL_HOST }}
          PRACTICE_LINUX_TUNNEL_PORT: ${{ secrets.PRACTICE_LINUX_TUNNEL_PORT }}
          PRACTICE_LINUX_TUNNEL_USER: ${{ secrets.PRACTICE_LINUX_TUNNEL_USER }}
          PRACTICE_LINUX_TUNNEL_PASSWORD: ${{ secrets.PRACTICE_LINUX_TUNNEL_PASSWORD }}
          PRACTICE_LINUX_API_REMOTE_PORT: ${{ secrets.PRACTICE_LINUX_API_REMOTE_PORT }}
          PRACTICE_LINUX_API_TOKEN: ${{ secrets.PRACTICE_LINUX_API_TOKEN }}
          PRACTICE_LINUX_SSH_HOST: ${{ secrets.PRACTICE_LINUX_SSH_HOST }}
          PRACTICE_LINUX_SSH_PORT: ${{ secrets.PRACTICE_LINUX_SSH_PORT }}
          PRACTICE_LINUX_LOCAL_HOST: ${{ secrets.PRACTICE_LINUX_LOCAL_HOST }}
          PRACTICE_LINUX_LOCAL_PORT: ${{ secrets.PRACTICE_LINUX_LOCAL_PORT }}
        run: tauri build

      - name: Prepare updater metadata
        shell: pwsh
        run: |
          $bundleDir = "Cliente-Rust/backend/target/release/bundle/nsis"
          $assetName = "Cliente.SSH.Unipiloto_$env:VERSION`_x64-setup.exe"
          $sourceExe = Get-ChildItem -LiteralPath $bundleDir -Filter "*_$env:VERSION`_x64-setup.exe" | Select-Object -First 1

          if (-not $sourceExe) {
            throw "No NSIS installer found for version $env:VERSION"
          }

          $assetPath = Join-Path $bundleDir $assetName
          Copy-Item -LiteralPath $sourceExe.FullName -Destination $assetPath -Force

          $signaturePath = "$($sourceExe.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "No updater signature found at $signaturePath"
          }

          $signature = (Get-Content -Raw -LiteralPath $signaturePath).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          # El release publica en este mismo repo (LabRemotoUpiloto/LaboRemoto,
          # ver paso "Create Release" abajo) — de ahi leen tanto la landing de
          # descarga (cliente-rust-nu5m.vercel.app) como el auto-updater
          # embebido en la app (tauri.conf.json > plugins.updater), ya
          # migrados desde el repo personal Haider2231/Releases-Cliente-SSH-Unipiloto.
          $url = "https://github.com/LabRemotoUpiloto/LaboRemoto/releases/download/v$env:VERSION/$assetName"

          $latest = [ordered]@{
            version = $env:VERSION
            notes = "Release v$env:VERSION"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }

          $latest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundleDir "latest.json") -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Cliente-Rust/backend/target/release/bundle/nsis/Cliente.SSH.Unipiloto_${{ env.VERSION }}_x64-setup.exe
            Cliente-Rust/backend/target/release/bundle/nsis/latest.json

  release-linux:
    needs: compute-version
    # Un binario compilado contra una glibc mas nueva no corre en sistemas
    # con una glibc mas vieja (glibc es compatible hacia adelante, no hacia
    # atras) -- por eso el repo viejo publicaba dos builds separados
    # (Debian 13/glibc>=2.39 y Debian 12/glibc>=2.36). Se replica lo mismo
    # acá: compilar en ubuntu-22.04 da un binario compatible con glibc>=2.36
    # (corre tambien en sistemas mas nuevos), compilar en ubuntu-24.04 da uno
    # que exige glibc>=2.39 y compilar en ubuntu-26.04 uno que exige glibc>=2.43.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            glibc_label: glibc2.36
          - runner: ubuntu-24.04
            glibc_label: glibc2.39
          - runner: ubuntu-26.04
            glibc_label: glibc2.43
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Decodificar la version
        # Deja VERSION en el entorno de TODOS los pasos siguientes de este job (env.VERSION en expresiones).
        shell: bash
        env:
          VERSION_COD: ${{ needs.compute-version.outputs.version_cod }}
        run: |
          VERSION=$(printf '%s' "$VERSION_COD" | tr 'abcdefghij_' '0123456789.')
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La version calculada no es valida (llego vacia o con otro formato)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Apply computed version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.VERSION;
            for (const f of ['Cliente-Rust/backend/tauri.conf.json', 'Cliente-Rust/frontend/package.json', 'Cliente-Rust/package.json']) {
              const content = fs.readFileSync(f, 'utf8');
              fs.writeFileSync(f, content.replace(/\"version\": \"[^\"]+\"/, '\"version\": \"' + version + '\"'));
            }
            const cargoPath = 'Cliente-Rust/backend/Cargo.toml';
            const cargo = fs.readFileSync(cargoPath, 'utf8');
            fs.writeFileSync(cargoPath, cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + version + '\"'));
            console.log('Version aplicada:', version);
          "

      - name: Install system dependencies
        # Paquetes nativos que Tauri necesita para compilar y empaquetar en
        # Linux (webkit2gtk para el webview, libappindicator para el tray,
        # patchelf/file para el bundler de AppImage/deb).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Cliente-Rust/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Cliente-Rust/frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        # Binario ya compilado desde npm, con la version fija. Antes se hacia `cargo install tauri-cli`, que compila el CLI
        # y resuelve sus dependencias de Rust al momento: el 2026-10-16 fallo en los 4 jobs porque tauri-cli 2.12.x exige
        # `zip ^8` y todas esas versiones de zip fueron retiradas (yanked) de crates.io. Con esto el release no depende de
        # lo que pase en crates.io ese dia, y se ahorra la compilacion del CLI. 2.12.1 es la que uso el ultimo release bueno.
        run: npm install -g @tauri-apps/cli@2.12.1

      - name: Build Tauri app
        working-directory: Cliente-Rust/backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Claves que build.rs EMBEBE en el binario (la app instalada no trae .env). Ver build.rs.
          # KEYCLOAK_BASE_URL es opcional: si el secreto no existe, la app usa el dominio por defecto.
          KEYCLOAK_BASE_URL: ${{ secrets.KEYCLOAK_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          PRACTICE_LINUX_TUNNEL_HOST: ${{ secrets.PRACTICE_LINUX_TUNNEL_HOST }}
          PRACTICE_LINUX_TUNNEL_PORT: ${{ secrets.PRACTICE_LINUX_TUNNEL_PORT }}
          PRACTICE_LINUX_TUNNEL_USER: ${{ secrets.PRACTICE_LINUX_TUNNEL_USER }}
          PRACTICE_LINUX_TUNNEL_PASSWORD: ${{ secrets.PRACTICE_LINUX_TUNNEL_PASSWORD }}
          PRACTICE_LINUX_API_REMOTE_PORT: ${{ secrets.PRACTICE_LINUX_API_REMOTE_PORT }}
          PRACTICE_LINUX_API_TOKEN: ${{ secrets.PRACTICE_LINUX_API_TOKEN }}
          PRACTICE_LINUX_SSH_HOST: ${{ secrets.PRACTICE_LINUX_SSH_HOST }}
          PRACTICE_LINUX_SSH_PORT: ${{ secrets.PRACTICE_LINUX_SSH_PORT }}
          PRACTICE_LINUX_LOCAL_HOST: ${{ secrets.PRACTICE_LINUX_LOCAL_HOST }}
          PRACTICE_LINUX_LOCAL_PORT: ${{ secrets.PRACTICE_LINUX_LOCAL_PORT }}
        # --bundles sobreescribe `bundle.targets` de tauri.conf.json (que solo
        # trae "nsis", el instalador de Windows) sin tocar ese archivo -- el
        # job de Windows sigue usando el target committeado tal cual.
        run: tauri build --bundles deb,appimage

      - name: Rename assets con sufijo de compatibilidad glibc
        # Los dos legs de la matriz producen archivos con el MISMO nombre
        # (Tauri no mete la version de Ubuntu/glibc en el nombre) -- sin este
        # sufijo, el que termine segundo pisaria el asset del que termino
        # primero al subir los dos al mismo release.
        shell: bash
        working-directory: Cliente-Rust/backend/target/release/bundle
        run: |
          for f in deb/*.deb; do
            mv "$f" "deb/$(basename "$f" .deb)-${{ matrix.glibc_label }}.deb"
          done
          for f in appimage/*.AppImage; do
            mv "$f" "appimage/$(basename "$f" .AppImage)-${{ matrix.glibc_label }}.AppImage"
          done

      - name: Create Release
        # No genera/toca latest.json (metadata del auto-updater) -- ese
        # mecanismo hoy solo existe para Windows (unico target configurado en
        # el plugin updater). Publicar los assets de Linux en el mismo tag no
        # tiene ese riesgo: son archivos con nombre distinto al de Windows.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Cliente-Rust/backend/target/release/bundle/deb/*.deb
            Cliente-Rust/backend/target/release/bundle/appimage/*.AppImage
