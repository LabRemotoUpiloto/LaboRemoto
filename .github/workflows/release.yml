name: Build and Release (Windows NSIS)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Optional: embed key for controlled demo builds; remove if using AppData/proxy only
      EMBED_OPENAI_API_KEY: ${{ secrets.EMBED_OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri Node CLI
        run: npm i -g @tauri-apps/cli@2

      - name: Add npm global bin to PATH
        shell: pwsh
        run: |
          echo "Adding $env:APPDATA\\npm to PATH"
          echo "$env:APPDATA\\npm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install NSIS (for bundling)
        shell: powershell
        run: choco install nsis -y

      - name: Add Cargo bin to PATH
        shell: pwsh
        run: |
          echo "Adding $env:USERPROFILE\.cargo\bin to PATH"
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tauri CLI
        shell: pwsh
        run: |
          node --version
          npm --version
          tauri --version
          cargo --version
          cargo tauri --version

      - name: Install frontend deps
        working-directory: apps/desktop/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop/web
        run: npm run build

      - name: Normalize signing key (no output)
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY missing" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD missing" }
          $k = $env:TAURI_SIGNING_PRIVATE_KEY -replace "\s",""
          $mod = $k.Length % 4
          if ($mod -ne 0) { $k = $k + ('=' * (4 - $mod)) }
          # Validate silently
          [void][System.Convert]::FromBase64String($k)
          # Overwrite env var for subsequent steps
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"

      - name: Build Tauri app (Windows)
        working-directory: apps/desktop/src-tauri
        run: tauri build

      - name: Generate latest.json (fallback)
        if: ${{ always() }}
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $nsis = Join-Path $bundle 'nsis'
          if (-not (Test-Path $nsis)) { Write-Host "NSIS dir not found: $nsis"; exit 0 }

          # Pick most recent .exe and .sig
          $exe = Get-ChildItem -Path $nsis -Filter *.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsis -Filter *.sig -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe -or -not $sig) { Write-Host "Missing exe or sig; skipping latest.json generation"; exit 0 }

          # Read version from tauri.conf.json
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $version = $conf.version

          # Compose download URL using the current tag name
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$($exe.Name)"

          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("s") + "Z"

          $obj = [ordered]@{
            version   = $version
            notes     = ""
            pub_date  = $pubDate
            platforms = @{ "windows-x86_64" = @{ signature = $signature; url = $downloadUrl } }
          }
          $json = $obj | ConvertTo-Json -Depth 5
          $out = Join-Path $bundle 'latest.json'
          Set-Content -Path $out -Value $json -Encoding utf8
          Write-Host "latest.json generated at $out"

      - name: Locate latest.json
        id: find_latest
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          Write-Host "Searching for latest.json under $bundle ..."
          $latest = Get-ChildItem -Recurse $bundle -Filter latest.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($latest) {
            Write-Host "Found: $($latest.FullName)"
            "path=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Host "latest.json not found"
          }
      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Publish release so that /releases/latest resolves and assets are public
          draft: false
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/latest.json
            apps/desktop/src-tauri/target/release/bundle/**/latest.json
            ${{ steps.find_latest.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
