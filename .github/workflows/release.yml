name: Build and Release (Multi-OS)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: "nsis"
          - os: ubuntu-latest
            bundles: "deb appimage"
          - os: macos-latest
            bundles: "dmg"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            libgtk-3-dev

      - name: Install Windows dependencies (NSIS)
        if: matrix.os == 'windows-latest'
        run: choco install nsis -y

      - name: Install Tauri Node CLI
        run: npm i -g @tauri-apps/cli@2

      - name: Install web deps
        working-directory: apps/desktop/web
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-fund --no-audit
          else
            npm install --no-fund --no-audit
          fi
        shell: bash

      - name: Build web app
        working-directory: apps/desktop/web
        run: npm run build

      - name: Normalize signing key (no output)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY missing" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD missing" }
          $k = $env:TAURI_SIGNING_PRIVATE_KEY -replace "\s",""
          $mod = $k.Length % 4
          if ($mod -ne 0) { $k = $k + ('=' * (4 - $mod)) }
          [void][System.Convert]::FromBase64String($k)
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$k"

      - name: Build Tauri app
        working-directory: apps/desktop/src-tauri
        env:
          SKIP_WEB_BUILD: '1'
          EMBED_OPENAI_API_KEY: ${{ secrets.EMBED_OPENAI_API_KEY }}
        run: tauri build --bundles ${{ matrix.bundles }}

      - name: Generate latest.json (Windows only)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          $nsis = Join-Path $bundle 'nsis'
          if (-not (Test-Path $nsis)) { Write-Host "NSIS dir not found: $nsis"; exit 0 }
          $exe = Get-ChildItem -Path $nsis -Filter *.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsis -Filter *.sig -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe -or -not $sig) { Write-Host "Missing exe or sig; skipping latest.json generation"; exit 0 }
          $confPath = "apps/desktop/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $version = $conf.version
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $downloadUrl = "https://github.com/$repo/releases/download/$tag/$($exe.Name)"
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("s") + "Z"
          $obj = [ordered]@{
            version   = $version
            notes     = ""
            pub_date  = $pubDate
            platforms = @{ "windows-x86_64" = @{ signature = $signature; url = $downloadUrl } }
          }
          $json = $obj | ConvertTo-Json -Depth 5
          $out = Join-Path $nsis 'latest.json'
          Set-Content -Path $out -Value $json -Encoding utf8
          Write-Host "latest.json generated at $out"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          append_body: true
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
