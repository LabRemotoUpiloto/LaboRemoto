name: Build and Release (Windows NSIS)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Optional: embed key for controlled demo builds; remove if using AppData/proxy only
      EMBED_OPENAI_API_KEY: ${{ secrets.EMBED_OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri Node CLI
        run: npm i -g @tauri-apps/cli@2

      - name: Add npm global bin to PATH
        shell: pwsh
        run: |
          echo "Adding $env:APPDATA\\npm to PATH"
          echo "$env:APPDATA\\npm" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install NSIS (for bundling)
        shell: powershell
        run: choco install nsis -y

      - name: Add Cargo bin to PATH
        shell: pwsh
        run: |
          echo "Adding $env:USERPROFILE\.cargo\bin to PATH"
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Tauri CLI
        shell: pwsh
        run: |
          node --version
          npm --version
          tauri --version

      - name: Install frontend deps
        working-directory: apps/desktop/web
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop/web
        run: npm run build

      - name: Build Tauri app (Windows)
        working-directory: apps/desktop/src-tauri
        run: tauri build

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
