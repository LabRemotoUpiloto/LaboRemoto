name: Build & Release

on:
  # Solo Produccion publica releases publicos -- pushes a Desarrollo/
  # Pruebas(QA)/main tambien disparaban esto antes, generando un release
  # publico real (visible al auto-updater) por cada merge intermedio, no
  # solo cuando el codigo de verdad llega a produccion.
  push:
    branches: [Produccion]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure release version is unique
        # La version comiteada en el repo (tauri.conf.json/Cargo.toml/package.json)
        # a veces se queda atras porque alguien se olvida de subirla antes de
        # mergear a Produccion -- eso hace que el workflow reescriba el release
        # ya publicado en vez de crear uno nuevo, y el auto-updater de Tauri
        # nunca ve una version mas alta para ofrecer (paso silenciosamente esto
        # con v3.5.2 -> v3.5.3). Este paso compara contra el release mas alto
        # ya publicado y, si hace falta, sube el patch automaticamente -- solo
        # en el workspace efimero de este runner, nunca se comitea de vuelta
        # (evita pelear con la proteccion de rama que exige revisor).
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tauriConfPath = "Cliente-Rust/backend/tauri.conf.json"
          $config = Get-Content $tauriConfPath -Raw | ConvertFrom-Json
          $baseVersion = $config.version

          function Compare-Version($a, $b) {
            $pa = $a.Split('.') | ForEach-Object { [int]$_ }
            $pb = $b.Split('.') | ForEach-Object { [int]$_ }
            for ($i = 0; $i -lt 3; $i++) {
              if ($pa[$i] -ne $pb[$i]) { return $pa[$i] - $pb[$i] }
            }
            return 0
          }

          $existingTags = gh release list --repo LabRemotoUpiloto/LaboRemoto --limit 100 --json tagName --jq '.[].tagName' 2>$null
          $versions = @($existingTags | ForEach-Object { $_ -replace '^v', '' } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' })

          $highestPublished = $null
          foreach ($v in $versions) {
            if ($null -eq $highestPublished -or (Compare-Version $v $highestPublished) -gt 0) { $highestPublished = $v }
          }

          if ($null -eq $highestPublished -or (Compare-Version $baseVersion $highestPublished) -gt 0) {
            # Nada publicado todavia, o la version del repo ya esta por delante
            # de todo lo publicado -- no hace falta tocar nada.
            $finalVersion = $baseVersion
          } else {
            $p = $highestPublished.Split('.')
            $finalVersion = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          }

          Write-Host "Version en el repo: $baseVersion | Release mas alto publicado: $highestPublished | Version final para este build: $finalVersion"

          if ($finalVersion -ne $baseVersion) {
            Write-Host "Subiendo version automaticamente (solo para este build, no se comitea): $baseVersion -> $finalVersion"
            foreach ($f in @("Cliente-Rust/backend/tauri.conf.json", "Cliente-Rust/frontend/package.json", "Cliente-Rust/package.json")) {
              (Get-Content $f -Raw) -replace [regex]::Escape("`"version`": `"$baseVersion`""), "`"version`": `"$finalVersion`"" | Set-Content $f -NoNewline
            }
            $cargoPattern = "(?m)^version = " + [regex]::Escape("`"$baseVersion`"")
            (Get-Content "Cliente-Rust/backend/Cargo.toml" -Raw) -replace $cargoPattern, "version = `"$finalVersion`"" | Set-Content "Cliente-Rust/backend/Cargo.toml" -NoNewline
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Cliente-Rust/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Cliente-Rust/frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        working-directory: Cliente-Rust/backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          echo "VERSION=$($config.version)" >> $env:GITHUB_OUTPUT
        working-directory: Cliente-Rust/backend

      - name: Prepare updater metadata
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $bundleDir = "Cliente-Rust/backend/target/release/bundle/nsis"
          $assetName = "Cliente.SSH.Unipiloto_$env:VERSION`_x64-setup.exe"
          $sourceExe = Get-ChildItem -LiteralPath $bundleDir -Filter "*_$env:VERSION`_x64-setup.exe" | Select-Object -First 1

          if (-not $sourceExe) {
            throw "No NSIS installer found for version $env:VERSION"
          }

          $assetPath = Join-Path $bundleDir $assetName
          Copy-Item -LiteralPath $sourceExe.FullName -Destination $assetPath -Force

          $signaturePath = "$($sourceExe.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "No updater signature found at $signaturePath"
          }

          $signature = (Get-Content -Raw -LiteralPath $signaturePath).Trim()
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          # El release publica en este mismo repo (LabRemotoUpiloto/LaboRemoto,
          # ver paso "Create Release" abajo) — de ahi leen tanto la landing de
          # descarga (cliente-rust-nu5m.vercel.app) como el auto-updater
          # embebido en la app (tauri.conf.json > plugins.updater), ya
          # migrados desde el repo personal Haider2231/Releases-Cliente-SSH-Unipiloto.
          $url = "https://github.com/LabRemotoUpiloto/LaboRemoto/releases/download/v$env:VERSION/$assetName"

          $latest = [ordered]@{
            version = $env:VERSION
            notes = "Release v$env:VERSION"
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $url
              }
            }
          }

          $latest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $bundleDir "latest.json") -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Cliente-Rust/backend/target/release/bundle/nsis/Cliente.SSH.Unipiloto_${{ steps.version.outputs.VERSION }}_x64-setup.exe
            Cliente-Rust/backend/target/release/bundle/nsis/latest.json
