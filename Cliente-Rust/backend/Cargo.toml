[package]
name = "app"
version = "3.5.1"
edition = "2021"

[dependencies]
base64 = "0.21"
# Utilidades/base
anyhow = "1.0"
async-trait = "0.1"
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
ts-rs = "12.0"
tracing = "0.1"

# storage/encryption
argon2 = "0.4"
rand = "0.8"
chacha20poly1305 = "0.10"
hex = "0.4"
keyring = "1.0"
directories = "4.0"
sha2 = "0.10"
hkdf = "0.12"
whoami = "1.2"

# Runtime async
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

# SSH nativo (usa versiones beta compatibles entre sí)
russh = "=0.50.3"
ssh-key = "0.6"

# SFTP estable vía libssh2 (bloqueante, usamos spawn_blocking)
ssh2 = "0.9"

# PTY local (terminal local embebida, ConPTY en Windows / pty real en Unix)
portable-pty = "0.9"

# Portapapeles nativo (leer/escribir texto e imágenes desde el backend —
# navigator.clipboard no existe en el webview: http://tauri.localhost no es
# contexto seguro en Windows). png ya venía como dependencia transitiva.
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"

# Tauri v2
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# HTTP client y otros
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
dotenvy = "0.15"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["clock", "serde"] }
wildmatch = "2.1"
walkdir = "2"
regex = "1"
rfd = "0.14"
tungstenite = "0.21"
open = "5"          # Abre el navegador del sistema (OAuth loopback flow)

# LDAP authentication
ldap3 = "0.11"
jsonwebtoken = "9"

# REST API
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio-stream = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[[test]]
name = "session_manager_flow_test"
path = "tests/integration/session_manager_flow_test.rs"

[[test]]
name = "auth_ipc_dispatch_test"
path = "tests/integration/auth_ipc_dispatch_test.rs"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }
# Habilita `tauri::test::mock_app()` para tests de integración del
# dispatcher `ipc::IpcHub::spawn_dispatcher` (REFACTOR #5 Fase B) sin
# necesitar una ventana real.
tauri = { version = "2", features = ["test"] }
