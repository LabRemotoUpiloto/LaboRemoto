[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.21"
# Utilidades/base
anyhow = "1.0"
async-trait = "0.1"
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }

# Runtime async
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

# SSH nativo (usa versiones beta compatibles entre sí)
russh = "=0.50.3"
ssh-key = "0.6"

# Tauri v2
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
