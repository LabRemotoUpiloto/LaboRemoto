[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.21"
# Utilidades/base
anyhow = "1.0"
async-trait = "0.1"
once_cell = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }

# storage/encryption
argon2 = "0.4"
rand = "0.8"
chacha20poly1305 = "0.10"
hex = "0.4"
keyring = "1.0"
directories = "4.0"
sha2 = "0.10"
hkdf = "0.12"
whoami = "1.2"

# Runtime async
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }

# SSH nativo (usa versiones beta compatibles entre sí)
russh = "=0.50.3"
ssh-key = "0.6"

# SFTP estable vía libssh2 (bloqueante, usamos spawn_blocking)
ssh2 = "0.9"

# Tauri v2
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# HTTP client y otros
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["clock", "serde"] }
wildmatch = "2.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
lto = true
codegen-units = 1
